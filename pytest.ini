[pytest]
pythonpath = src
addopts = --cov=src/little_meals --cov-report=term-missing --cov-fail-under=85
testpaths = tests
norecursedirs = bazel-* .git .venv venv
markers =
    requirement(requirement_id): maps test case to the requirement ID it verifies (auto-recorded into little-workshop's Requirements & Quality pillar by tests/conftest.py)
