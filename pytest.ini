[pytest]
pythonpath = src
addopts = --cov=src/little_meals --cov-report=term-missing --cov-fail-under=85 -m "not real_ollama and not real_spoonacular"
testpaths = tests
norecursedirs = bazel-* .git .venv venv
markers =
    requirement(requirement_id): maps test case to a little-requirements requirement ID
    real_ollama: hits a real local Ollama daemon over HTTP; excluded by default, run with -m real_ollama
    real_spoonacular: hits the real Spoonacular API over HTTP; excluded by default, run with -m real_spoonacular
