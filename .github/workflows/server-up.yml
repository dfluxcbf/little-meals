# Installed by `lrun init --server` (little-runner). Do not edit by hand: change
# the template in little-runner and re-run `lrun init`.
# See little-projects/docs/policies/automation_policy.md.
name: Server up

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check out, build, install and run"
        required: true
        default: "dev"
        type: string
      force:
        description: "Discard uncommitted changes in the host checkout if needed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: server-${{ github.repository }}
  cancel-in-progress: false

jobs:
  up:
    name: Stop, switch branch, build/install, launch
    runs-on: [self-hosted, little-runner]
    timeout-minutes: 90
    steps:
      - name: little-runner server up
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          FORCE=""
          if [[ "${{ inputs.force }}" == "true" ]]; then FORCE="--force"; fi
          little-runner server up "${GITHUB_REPOSITORY##*/}" --branch "${{ inputs.branch }}" $FORCE
