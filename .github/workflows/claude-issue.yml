# Installed by `lrun init` (little-runner). Do not edit by hand: change the
# template in little-runner and re-run `lrun init`.
# See little-projects/docs/policies/automation_policy.md.
name: Claude issue handler

on:
  issues:
    types: [assigned, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    name: Hand the issue to Claude on the WSL host
    runs-on: [self-hosted, little-runner]
    timeout-minutes: 240
    steps:
      - name: little-runner issue run
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          little-runner issue run \
            --repo "$GITHUB_REPOSITORY" \
            --number "${{ github.event.issue.number }}" \
            --event-path "$GITHUB_EVENT_PATH"

      - name: little-runner issue finish (/finish or /skip comment)
        if: >-
          github.event_name == 'issue_comment' &&
          !github.event.issue.pull_request &&
          (startsWith(github.event.comment.body, '/finish') ||
           startsWith(github.event.comment.body, '/skip'))
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          little-runner issue finish \
            --repo "$GITHUB_REPOSITORY" \
            --number "${{ github.event.issue.number }}" \
            --event-path "$GITHUB_EVENT_PATH"
