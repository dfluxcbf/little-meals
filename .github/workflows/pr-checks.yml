# Installed by `lrun init` (little-runner). Do not edit by hand: change the
# template in little-runner and re-run `lrun init`.
# See little-projects/docs/policies/automation_policy.md.
name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    # Never run a fork's code on the self-hosted runner: only pull requests
    # opened from a branch of this same repository qualify (forks can't be
    # collaborators, so this can only be tightened, never loosened, by an
    # untrusted PR author).
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Run the project's tests on the WSL host
    runs-on: [self-hosted, little-runner]
    timeout-minutes: 120
    steps:
      - name: little-runner ci run
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          little-runner ci run \
            --repo "$GITHUB_REPOSITORY" \
            --pr "${{ github.event.pull_request.number }}"
