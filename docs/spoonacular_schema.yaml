# Spoonacular /recipes/complexSearch parameter schema
#
# Generated from docs/spoonacular_api.md (GET /recipes/complexSearch and the
# "Known enum values" appendix). Lists every query parameter the endpoint
# accepts and, where Spoonacular publishes one, the full set of valid values.
#
# Caveats carried over from spoonacular_api.md:
# - Enum lists (cuisine, diet, intolerances, type, sort) are hand-copied from
#   prose docs, not machine-readable - treat as best-effort, not authoritative.
# - `query` is marked required by the OpenAPI spec but is optional in practice.
# - Numeric min/max nutrient filters exist for every nutrient Spoonacular
#   tracks; each is independently optional.

endpoint: GET /recipes/complexSearch
description: >
  Search through hundreds of thousands of recipes using advanced filtering
  and ranking. Combines searching by query, by ingredients, and by nutrients
  into one endpoint.

fields:
  query:
    type: string
    required: false
    description: The (natural language) search query.
    example: burger

  cuisine:
    type: string (comma-separated list, OR logic)
    required: false
    description: The cuisine(s) the recipes must match. One or more, comma separated.
    options: &cuisine_options
      - African
      - American
      - British
      - Cajun
      - Caribbean
      - Chinese
      - Eastern European
      - European
      - French
      - German
      - Greek
      - Indian
      - Irish
      - Italian
      - Japanese
      - Jewish
      - Korean
      - Latin American
      - Mediterranean
      - Mexican
      - Middle Eastern
      - Nordic
      - Southern
      - Spanish
      - Thai
      - Vietnamese

  excludeCuisine:
    type: string (comma-separated list, AND logic)
    required: false
    description: The cuisine(s) the recipes must not match. One or more, comma separated.
    options: *cuisine_options

  diet:
    type: string
    required: false
    description: The diet for which the recipes must be suitable.
    options:
      - Gluten Free
      - Ketogenic
      - Vegetarian
      - Lacto-Vegetarian
      - Ovo-Vegetarian
      - Vegan
      - Pescetarian
      - Paleo
      - Primal
      - Low FODMAP
      - Whole30

  intolerances:
    type: string (comma-separated list)
    required: false
    description: >
      Recipes returned must not contain ingredients unsuitable for the
      listed intolerances.
    options:
      - Dairy
      - Egg
      - Gluten
      - Grain
      - Peanut
      - Seafood
      - Sesame
      - Shellfish
      - Soy
      - Sulfite
      - Tree Nut
      - Wheat

  equipment:
    type: string (comma-separated list, OR logic)
    required: false
    description: The equipment required, e.g. "blender, frying pan, bowl".
    example: pan

  includeIngredients:
    type: string (comma-separated list)
    required: false
    description: Ingredients that should/must be used in the recipes.
    example: tomato,cheese

  excludeIngredients:
    type: string (comma-separated list)
    required: false
    description: Ingredients or ingredient types that the recipes must not contain.
    example: eggs

  type:
    type: string
    required: false
    description: The type of recipe.
    options:
      - main course
      - side dish
      - dessert
      - appetizer
      - salad
      - bread
      - breakfast
      - soup
      - beverage
      - sauce
      - marinade
      - fingerfood
      - snack
      - drink

  instructionsRequired:
    type: boolean
    required: false
    description: Whether the recipes must have instructions.

  fillIngredients:
    type: boolean
    required: false
    description: Add information about ingredients and whether they are used or missing.

  addRecipeInformation:
    type: boolean
    required: false
    description: If true, returns more information about each recipe.

  addRecipeNutrition:
    type: boolean
    required: false
    description: If true, returns nutritional information about each recipe.

  author:
    type: string
    required: false
    description: The username of the recipe author.
    example: coffeebean

  tags:
    type: string
    required: false
    description: Tags (diets, meal types, cuisines, or intolerances) the recipe must have.

  recipeBoxId:
    type: integer
    required: false
    description: Id of the recipe box to which the search should be limited.

  titleMatch:
    type: string
    required: false
    description: Text that must be found in the title of the recipes.
    example: Crock Pot

  maxReadyTime:
    type: number
    required: false
    description: Maximum time in minutes to prepare and cook the recipe.

  minServings:
    type: number
    required: false
    description: Minimum amount of servings the recipe is for.

  maxServings:
    type: number
    required: false
    description: Maximum amount of servings the recipe is for.

  ignorePantry:
    type: boolean
    required: false
    description: Whether to ignore typical pantry items (water, salt, flour, etc.).

  sort:
    type: string
    required: false
    description: The strategy to sort recipes by.
    options:
      - meta-score  # default relevance
      - popularity
      - healthiness
      - price
      - time
      - random
      - max-used-ingredients
      - min-missing-ingredients
      # plus most nutrient names below, e.g. calories, protein, carbs, fat

  sortDirection:
    type: string
    required: false
    description: The direction in which to sort.
    options:
      - asc
      - desc

  offset:
    type: integer
    required: false
    description: The number of results to skip.
    minimum: 0
    maximum: 900

  number:
    type: integer
    required: false
    description: The maximum number of items to return.
    minimum: 1
    maximum: 100
    default: 10

  # --- Nutrient range filters ---
  # Every nutrient below follows the same min<Name>/max<Name> pattern; each
  # bound is independently optional and filters the recipe's per-serving
  # nutrition value.
  nutrients:
    carbs:
      unit: grams
      fields: [minCarbs, maxCarbs]
    protein:
      unit: grams
      fields: [minProtein, maxProtein]
    calories:
      unit: kcal
      fields: [minCalories, maxCalories]
    fat:
      unit: grams
      fields: [minFat, maxFat]
    alcohol:
      unit: grams
      fields: [minAlcohol, maxAlcohol]
    caffeine:
      unit: milligrams
      fields: [minCaffeine, maxCaffeine]
    copper:
      unit: milligrams
      fields: [minCopper, maxCopper]
    calcium:
      unit: milligrams
      fields: [minCalcium, maxCalcium]
    choline:
      unit: milligrams
      fields: [minCholine, maxCholine]
    cholesterol:
      unit: milligrams
      fields: [minCholesterol, maxCholesterol]
    fluoride:
      unit: milligrams
      fields: [minFluoride, maxFluoride]
    saturatedFat:
      unit: grams
      fields: [minSaturatedFat, maxSaturatedFat]
    vitaminA:
      unit: IU
      fields: [minVitaminA, maxVitaminA]
    vitaminC:
      unit: milligrams
      fields: [minVitaminC, maxVitaminC]
    vitaminD:
      unit: micrograms
      fields: [minVitaminD, maxVitaminD]
    vitaminE:
      unit: milligrams
      fields: [minVitaminE, maxVitaminE]
    vitaminK:
      unit: micrograms
      fields: [minVitaminK, maxVitaminK]
    vitaminB1:
      unit: milligrams
      fields: [minVitaminB1, maxVitaminB1]
    vitaminB2:
      unit: milligrams
      fields: [minVitaminB2, maxVitaminB2]
    vitaminB5:
      unit: milligrams
      fields: [minVitaminB5, maxVitaminB5]
    vitaminB3:
      unit: milligrams
      fields: [minVitaminB3, maxVitaminB3]
    vitaminB6:
      unit: milligrams
      fields: [minVitaminB6, maxVitaminB6]
    vitaminB12:
      unit: micrograms
      fields: [minVitaminB12, maxVitaminB12]
    fiber:
      unit: grams
      fields: [minFiber, maxFiber]
    folate:
      unit: micrograms
      fields: [minFolate, maxFolate]
    folicAcid:
      unit: micrograms
      fields: [minFolicAcid, maxFolicAcid]
    iodine:
      unit: micrograms
      fields: [minIodine, maxIodine]
    iron:
      unit: milligrams
      fields: [minIron, maxIron]
    magnesium:
      unit: milligrams
      fields: [minMagnesium, maxMagnesium]
    manganese:
      unit: milligrams
      fields: [minManganese, maxManganese]
    phosphorus:
      unit: milligrams
      fields: [minPhosphorus, maxPhosphorus]
    potassium:
      unit: milligrams
      fields: [minPotassium, maxPotassium]
    selenium:
      unit: micrograms
      fields: [minSelenium, maxSelenium]
    sodium:
      unit: milligrams
      fields: [minSodium, maxSodium]
    sugar:
      unit: grams
      fields: [minSugar, maxSugar]
    zinc:
      unit: milligrams
      fields: [minZinc, maxZinc]
