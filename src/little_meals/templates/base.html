<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Meals{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#c55123">
  <link rel="icon" href="/static/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Meals">
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <div class="app-shell">
    {% if notification_pending %}
    <a href="/plan" class="notification-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-3Z"></path><path d="M2 11h20"></path></svg>
      Your new weekly plan is ready
    </a>
    {% endif %}
    <header class="topbar">
      <a href="/recipes" class="brand">Little Meals <span class="brand-version">v{{ app_version }}</span></a>
    </header>
    <main class="content {% block content_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% block bottom_bar %}{% endblock %}
    {% block fab %}{% endblock %}
    <nav class="tabbar" aria-label="Primary">
      <a href="/recipes" class="tab {% if nav_active == 'library' %}tab-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 6c-1.5-1.2-3.6-1.8-6-1.8-.8 0-1.2.4-1.2 1.1v12.4c0 .7.5 1.1 1.2 1.1 2.4 0 4.5.6 6 1.8 1.5-1.2 3.6-1.8 6-1.8.7 0 1.2-.4 1.2-1.1V5.3c0-.7-.4-1.1-1.2-1.1-2.4 0-4.5.6-6 1.8Z"></path>
          <path d="M12 6v13"></path>
        </svg>
        <span>Cookbook</span>
      </a>
      <a href="/plan" class="tab {% if nav_active == 'plan' %}tab-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15" rx="2"></rect>
          <path d="M8 3v4M16 3v4M3.5 9.5h17"></path>
          <path d="M8.5 14l2 2 4-4"></path>
        </svg>
        <span>This week</span>
      </a>
      <a href="/shopping" class="tab {% if nav_active == 'shopping' %}tab-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5h9l3 3V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"></path>
          <path d="M9 10h6M9 13.5h6M9 17h4"></path>
        </svg>
        <span>Shopping</span>
      </a>
      <a href="/settings" class="tab {% if nav_active == 'settings' %}tab-active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 13.5a7.5 7.5 0 0 0 0-3l1.6-1.3-1.5-2.6-1.9.6a7.6 7.6 0 0 0-2.6-1.5l-.3-2h-3l-.3 2a7.6 7.6 0 0 0-2.6 1.5l-1.9-.6-1.5 2.6L6 10.5a7.5 7.5 0 0 0 0 3l-1.6 1.3 1.5 2.6 1.9-.6c.8.7 1.6 1.2 2.6 1.5l.3 2h3l.3-2c1-.3 1.8-.8 2.6-1.5l1.9.6 1.5-2.6Z"></path>
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
