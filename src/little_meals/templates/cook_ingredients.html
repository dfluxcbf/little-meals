<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ recipe.name }} - Ingredients - little-meals</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="theme-color" content="#c55123">
  <link rel="icon" href="/static/icons/favicon-64.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Little Meals">
  <link rel="stylesheet" href="/static/fonts.css?v={{ app_version }}">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/js/cook-swipe.js" defer></script>
</head>
<body>
  <div class="cook-shell" data-swipe-prev="" data-swipe-next="/recipes/{{ recipe.id }}/cook/1">
    <div class="cook-header">
      <a href="/recipes/{{ recipe.id }}" class="cook-close" aria-label="Leave cook-along">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        <span class="cook-close-label">Leave</span>
      </a>
      <span class="cook-title">{{ recipe.name }}</span>
      <span class="cook-step-label">Ingredients</span>
    </div>

    <div class="cook-ingredients-body">
      <h2 class="cook-ingredients-heading">Gather your ingredients</h2>
      <div class="cook-ingredients-list">
        {% for ingredient in recipe.ingredients %}
          {% set index = loop.index0 %}
          {% set checked = index in checked %}
          {% include "partials/_cook_ingredient.html" %}
        {% endfor %}
      </div>
    </div>

    <div class="cook-nav">
      <span class="btn btn-secondary cook-prev cook-prev-disabled" aria-hidden="true">&larr;</span>
      <a href="/recipes/{{ recipe.id }}/cook/1" class="btn btn-primary cook-next">Start cooking</a>
    </div>
  </div>
</body>
</html>
