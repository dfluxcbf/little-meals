<div class="recipe-card" id="recipe-row-{{ recipe.id }}">
  <div class="recipe-card-spine badge-{{ recipe.classification.value }}"></div>
  <div class="recipe-card-body">
    <div class="recipe-card-top">
      <h3><a href="/recipes/{{ recipe.id }}">{{ recipe.name }}</a></h3>
    </div>
    <div class="recipe-card-meta">
      <span>{{ recipe.cook_time_minutes }} min</span>
      {% if recipe.nutrition.calories_per_serving is not none %}
        <span>{{ recipe.nutrition.calories_per_serving }} kcal</span>
      {% endif %}
    </div>
    <span class="badge badge-{{ recipe.classification.value }}">{{ recipe.classification.value|capitalize }}</span>
  </div>
</div>
