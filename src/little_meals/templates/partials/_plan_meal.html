<div class="plan-meal" id="plan-meal-{{ meal.id }}">
  <div class="plan-meal-top">
    <h3><a href="/recipes/{{ recipe.id }}">{{ recipe.name }}</a></h3>
    <div style="display: flex; gap: 6px; align-items: center; flex-shrink: 0;">
      {% if meal.is_suggestion %}<span class="badge badge-new">NEW</span>{% endif %}
      <form hx-post="/plan/meals/{{ meal.id }}/cooked" hx-target="#plan-meal-{{ meal.id }}" hx-swap="outerHTML">
        <input type="hidden" name="cooked" value="{{ 'false' if meal.cooked else 'true' }}">
        <button type="submit" class="pot-stamp {% if meal.cooked %}pot-stamp-active{% endif %}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v3a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-3Z"></path><path d="M2 11h20"></path></svg>
          {{ "Cooked" if meal.cooked else "Mark cooked" }}
        </button>
      </form>
    </div>
  </div>
  <div class="plan-meal-meta">
    <span>{{ recipe.cook_time_minutes }} min</span>
    <span>{{ recipe.nutrition.calories_per_serving }} kcal</span>
    <span class="badge badge-{{ recipe.classification.value }}">{{ recipe.classification.value|capitalize }}</span>
  </div>
  <div class="servings-row">
    <label for="servings-{{ meal.id }}">Servings</label>
    <input
      type="number"
      id="servings-{{ meal.id }}"
      name="servings"
      min="1"
      value="{{ meal.servings }}"
      hx-post="/plan/meals/{{ meal.id }}/servings"
      hx-trigger="change"
      hx-target="#plan-meal-{{ meal.id }}"
      hx-swap="outerHTML"
    >
  </div>
  <div class="plan-meal-actions">
    <div class="reroll-actions">
      <form hx-post="/plan/meals/{{ meal.id }}/preference" hx-target="#plan-meal-{{ meal.id }}" hx-swap="outerHTML">
        <input type="hidden" name="preference" value="liked">
        <button type="submit" class="thumb-btn {% if recipe.preference.value == 'liked' %}thumb-liked{% endif %}" aria-label="Like this recipe">
          <svg viewBox="0 0 24 24" fill="{{ 'currentColor' if recipe.preference.value == 'liked' else 'none' }}" stroke="currentColor" stroke-width="1.9"><path d="M7 10v11H3V10h4Zm0 0 4-7a2 2 0 0 1 2 2v4h5.3a2 2 0 0 1 1.9 2.6l-2 7A2 2 0 0 1 16.3 21H7"></path></svg>
        </button>
      </form>
      <form hx-post="/plan/meals/{{ meal.id }}/preference" hx-target="#plan-meal-{{ meal.id }}" hx-swap="outerHTML">
        <input type="hidden" name="preference" value="disliked">
        <button type="submit" class="thumb-btn {% if recipe.preference.value == 'disliked' %}thumb-disliked{% endif %}" aria-label="Not for us">
          <svg viewBox="0 0 24 24" fill="{{ 'currentColor' if recipe.preference.value == 'disliked' else 'none' }}" stroke="currentColor" stroke-width="1.9" style="transform: scaleY(-1);"><path d="M7 10v11H3V10h4Zm0 0 4-7a2 2 0 0 1 2 2v4h5.3a2 2 0 0 1 1.9 2.6l-2 7A2 2 0 0 1 16.3 21H7"></path></svg>
        </button>
      </form>
    </div>
    {% if not plan.finalized %}
    <div class="reroll-actions">
      <form hx-post="/plan/meals/{{ meal.id }}/reroll" hx-target="#plan-meal-{{ meal.id }}" hx-swap="outerHTML">
        <button type="submit" class="reroll-btn" title="Reroll this meal" aria-label="Reroll this meal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="16" height="16" rx="3"></rect><circle cx="9" cy="9" r="1.2" fill="currentColor"></circle><circle cx="15" cy="15" r="1.2" fill="currentColor"></circle></svg>
        </button>
      </form>
      <a href="/plan/meals/{{ meal.id }}/alternatives" class="reroll-btn" title="See 10 alternatives" aria-label="See 10 alternatives">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="12" rx="2"></rect><path d="M9 8h11v11H9z"></path></svg>
      </a>
    </div>
    {% endif %}
  </div>
</div>
