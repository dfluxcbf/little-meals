[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "little-meals"
version = "0.4.0"
description = "Meal planning facilitator and recipe book"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "coverage>=7"]

[project.scripts]
little-meals = "little_meals.cli:main"
lmeals = "little_meals.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["little_meals*"]

[tool.setuptools.package-data]
little_meals = ["templates/**/*.html", "static/**/*"]
